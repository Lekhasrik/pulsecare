<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Add Doctor</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">

    <h2 class="text-3xl font-bold text-center text-green-700 mb-6">
        Add Doctor
    </h2>

    <form th:action="@{/admin/save-doctor}" method="post" th:object="${doctor}" class="space-y-4">

        <div>
            <label class="block text-gray-700 font-medium mb-1">Doctor Name</label>
            <input type="text" th:field="*{name}"
                   placeholder="Enter doctor name"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Specialization</label>
            <input type="text" th:field="*{specialization}"
                   placeholder="Enter specialization"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Phone</label>
            <input type="text" th:field="*{phone}"
                   placeholder="Enter phone number"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Consultation Fee</label>
            <input type="number" th:field="*{fee}"
                   placeholder="Enter fee"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <button type="submit"
                class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition duration-300 font-semibold">
            Save Doctor
        </button>

    </form>

</div>

</body>
</html>
