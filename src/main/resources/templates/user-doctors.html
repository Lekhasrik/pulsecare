<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors - PulseCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- 🔵 Navbar -->
<div class="bg-blue-600 text-white px-10 py-4 shadow-md">
    <h1 class="text-2xl font-bold">💙 PulseCare</h1>
</div>

<div class="max-w-4xl mx-auto p-10">

    <h2 class="text-3xl font-bold text-center text-blue-800 mb-8">
        Doctors List
    </h2>

    <div class="bg-white shadow-xl rounded-2xl overflow-hidden">

        <table class="min-w-full text-left">

            <!-- Header -->
            <thead class="bg-blue-600 text-white">
            <tr>
                <th class="px-6 py-4">Name</th>
                <th class="px-6 py-4">Specialization</th>
            </tr>
            </thead>

            <!-- Body -->
            <tbody class="divide-y divide-gray-200">

            <tr th:each="doc : ${doctors}"
                class="hover:bg-gray-50 transition duration-200">

                <td class="px-6 py-4 font-semibold text-gray-800"
                    th:text="${doc.name}"></td>

                <td class="px-6 py-4 text-blue-600 font-medium"
                    th:text="${doc.specialization}"></td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<footer class="bg-blue-600 text-white text-center py-4 mt-10">
    © 2026 PulseCare Hospital
</footer>

</body>
</html>
