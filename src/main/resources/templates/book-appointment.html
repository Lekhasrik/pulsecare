<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment - PulseCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<!-- 🔵 Navbar -->
<div class="bg-blue-600 text-white px-10 py-4 flex justify-between">
    <h1 class="text-2xl font-bold">💙 PulseCare</h1>

    <div class="space-x-6">
        <a href="/" class="hover:text-gray-200">Home</a>
        <a href="/about" class="hover:text-gray-200">About</a>
        <a href="/appointment" class="hover:text-gray-200">Book Appointment</a>
        <a href="/login" class="hover:text-gray-200">Login</a>
        <a href="/contact" class="hover:text-gray-200">Contact</a>
    </div>
</div>

<!-- 🔵 Center Content -->
<section class="py-16 flex justify-center">

    <div class="bg-white shadow-xl rounded-2xl p-10 w-96">

        <h2 class="text-3xl font-bold text-blue-800 text-center mb-8">
            Book Appointment
        </h2>

        <form th:action="@{/appointment}"
              th:object="${appointment}"
              method="post">

            <input type="text"
                   th:field="*{patientName}"
                   placeholder="Patient Name"
                   class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

            <input type="text"
                   th:field="*{doctorName}"
                   placeholder="Doctor Name"
                   class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

            <input type="date"
                   th:field="*{date}"
                   class="w-full p-3 border rounded-lg mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500">

            <button type="submit"
                    class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition">
                Book Now
            </button>
        </form>

    </div>

</section>

</body>
</html>
