<!DOCTYPE html>
<html>
<head>
    <title>Admin - Book Appointment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            width: 420px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #1e3c72;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #16305c;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Admin Book Appointment</h2>

    <form action="/admin/save-appointment" method="post">
        <input type="text" name="patientName" placeholder="Patient Name" required>
        <input type="text" name="doctorName" placeholder="Doctor Name" required>
        <input type="date" name="appointmentDate" required>
        <button type="submit">Book Appointment</button>
    </form>
</div>

</body>
</html>
