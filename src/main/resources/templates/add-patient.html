<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Add Patient</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-lg">

    <h2 class="text-3xl font-bold text-center text-blue-700 mb-6">
        Add Patient
    </h2>

    <form th:action="@{/admin/save-patient}" method="post" th:object="${patient}" class="space-y-4">

        <div>
            <label class="block text-gray-700 font-medium mb-1">Full Name</label>
            <input type="text" th:field="*{name}"
                   placeholder="Enter patient name"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Age</label>
            <input type="number" th:field="*{age}"
                   placeholder="Enter age"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Email</label>
            <input type="email" th:field="*{email}"
                   placeholder="Enter email"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Gender</label>
            <input type="text" th:field="*{gender}"
                   placeholder="Enter gender"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Phone</label>
            <input type="text" th:field="*{phone}"
                   placeholder="Enter phone number"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium mb-1">Disease / Condition</label>
            <input type="text" th:field="*{disease}"
                   placeholder="Enter disease"
                   class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-300 font-semibold">
            Save Patient
        </button>

    </form>

</div>

</body>
</html>
